name: Compile Check

# Compiles the Unity-independent core (compiler, database, service, file
# wrapper) against minimal UnityEngine stubs and runs the semantic tests.
# This is the fast safety net that runs on every push.

on:
  push:
    branches:
      - "arena/01a01ae0-dialogueengineunity"
  pull_request:
  workflow_dispatch:

jobs:
  compile-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build & run core tests
        run: dotnet run --project Tools/CompileCheck/CompileCheck.csproj -c Release
